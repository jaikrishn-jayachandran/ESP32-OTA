name: Notify OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'ESP-32-OTA-Firmware-Update.bin'
      - 'config.json'
  workflow_dispatch:

env:
  FIRMWARE_BIN: ESP-32-OTA-Firmware-Update.bin

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Firmware Binary
        run: |
          if [ ! -f "$FIRMWARE_BIN" ]; then
            echo "ERROR: $FIRMWARE_BIN not found in repository root"
            exit 1
          fi
          echo "Firmware binary found:"
          ls -lh "$FIRMWARE_BIN"

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ota-${{ hashFiles('scripts/notify_ota_update.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-ota-

      - name: Run OTA Notification Script
        env:
          FIRMWARE_AES_KEY: ${{ secrets.FIRMWARE_AES_KEY }}
        run: |
          # Use pre-installed system Python 3 directly
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet paho-mqtt cryptography

          # Compute SHA-256 and export to script environment
          FIRMWARE_SHA256=$(sha256sum "$FIRMWARE_BIN" | awk '{print $1}')
          export FIRMWARE_SHA256

          # Execute Python script
          python3 scripts/notify_ota_update.py