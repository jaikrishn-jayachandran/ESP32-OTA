name: Notify OTA Update

on:
  push:
    branches:
      - main
    paths:
      - 'ESP-32-OTA-Firmware-Update.bin'   # Keep this as a trigger example; actual name from config.json may differ
      - 'config.json'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Optional: Verify binary exists based on config.json (if you want an early check)
      - name: Verify Firmware Binary Exists
        run: |
          python3 - <<'EOF'
          import json, os, sys
          with open('config.json') as f:
              config = json.load(f)
          bin_file = config['firmware_bin']
          if not os.path.exists(bin_file):
              print(f"ERROR: {bin_file} not found")
              sys.exit(1)
          print(f"Firmware binary found: {bin_file}")
          EOF

      - name: Cache Pip Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ota-${{ hashFiles('scripts/notify_ota_update.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-ota-

      - name: Run OTA Notification Script
        env:
          FIRMWARE_AES_KEY: ${{ secrets.FIRMWARE_AES_KEY }}
          # FIRMWARE_SHA256 is optional; script will compute if not set
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet paho-mqtt cryptography
          python3 scripts/notify_ota_update.py